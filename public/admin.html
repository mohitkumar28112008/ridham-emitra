<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ridham eMitra - Admin Panel</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .admin-page {
      min-height: 100vh;
      background: #f2f5f9;
      padding: 50px 0;
    }

    .admin-login {
      max-width: 420px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,.08);
    }

    .admin-login h1 {
      margin-bottom: 10px;
    }

    .admin-login p {
      color: #707b8c;
      margin-bottom: 25px;
    }

    .admin-login input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce2ea;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .admin-dashboard {
      display: none;
    }

    .admin-title {
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 16px;
    }

    .stat-card span {
      color: #7a8495;
      font-size: 13px;
    }

    .stat-card h2 {
      font-size: 32px;
      margin-top: 5px;
    }

    .table-box {
      background: white;
      border-radius: 16px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid #edf0f4;
      font-size: 14px;
    }

    th {
      background: #07152f;
      color: white;
    }

    .status-select {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>

</head>


<body>

  <div class="admin-page">

    <div class="container">


      <!-- LOGIN -->

      <div id="loginBox" class="admin-login">

        <h1>Admin Panel</h1>

        <p>
          Ridham eMitra Appointment Management
        </p>

        <input
          type="password"
          id="adminPassword"
          placeholder="Enter admin password"
        >

        <button
          class="btn btn-primary"
          onclick="login()"
        >
          Login
        </button>

        <p
          id="loginMessage"
          style="margin-top:15px;"
        ></p>

      </div>


      <!-- DASHBOARD -->

      <div
        id="dashboard"
        class="admin-dashboard"
      >

        <div class="admin-title">

          <h1>Ridham eMitra Dashboard</h1>

          <p>
            Manage your appointments here.
          </p>

        </div>


        <div class="stats">

          <div class="stat-card">
            <span>Total</span>
            <h2 id="totalCount">0</h2>
          </div>

          <div class="stat-card">
            <span>Pending</span>
            <h2 id="pendingCount">0</h2>
          </div>

          <div class="stat-card">
            <span>Confirmed</span>
            <h2 id="confirmedCount">0</h2>
          </div>

          <div class="stat-card">
            <span>Completed</span>
            <h2 id="completedCount">0</h2>
          </div>

        </div>


        <div class="table-box">

          <table>

            <thead>

              <tr>
                <th>Token</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Service</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
              </tr>

            </thead>

            <tbody id="appointmentsBody"></tbody>

          </table>

        </div>

      </div>

    </div>

  </div>


<script>

async function login() {

  const password =
    document.getElementById("adminPassword").value;

  const message =
    document.getElementById("loginMessage");


  try {

    const response =
      await fetch("/api/admin/login", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({ password })

      });


    const data =
      await response.json();


    if (!response.ok) {

      message.textContent =
        data.error || "Login failed.";

      return;
    }


    document.getElementById("loginBox").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";


    loadAppointments();

  } catch (error) {

    message.textContent =
      "Unable to connect to server.";

  }

}


async function loadAppointments() {

  const response =
    await fetch("/api/admin/appointments");

  const appointments =
    await response.json();


  document.getElementById("totalCount").textContent =
    appointments.length;

  document.getElementById("pendingCount").textContent =
    appointments.filter(a => a.status === "Pending").length;

  document.getElementById("confirmedCount").textContent =
    appointments.filter(a => a.status === "Confirmed").length;

  document.getElementById("completedCount").textContent =
    appointments.filter(a => a.status === "Completed").length;


  const body =
    document.getElementById("appointmentsBody");

  body.innerHTML = "";


  appointments.forEach(appointment => {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>
        <strong>${appointment.token}</strong>
      </td>

      <td>${appointment.name}</td>

      <td>${appointment.phone}</td>

      <td>${appointment.service}</td>

      <td>${appointment.date}</td>

      <td>${appointment.time}</td>

      <td>

        <select
          class="status-select"
          onchange="updateStatus(${appointment.id}, this.value)"
        >

          <option
            ${appointment.status === "Pending" ? "selected" : ""}
          >
            Pending
          </option>

          <option
            ${appointment.status === "Confirmed" ? "selected" : ""}
          >
            Confirmed
          </option>

          <option
            ${appointment.status === "Completed" ? "selected" : ""}
          >
            Completed
          </option>

          <option
            ${appointment.status === "Cancelled" ? "selected" : ""}
          >
            Cancelled
          </option>

        </select>

      </td>

    `;


    body.appendChild(row);

  });

}


async function updateStatus(id, status) {

  await fetch(`/api/admin/appointments/${id}`, {

    method: "PATCH",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({ status })

  });


  loadAppointments();

}

</script>

</body>

</html>
